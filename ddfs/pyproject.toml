[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddfs"
version = "0.1.0"
description = "Data-Driven Funnel Synthesis for Online Tracking Control"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Shiva Shakeri", email = "sshakeri@uw.edu"}
]
keywords = [
    "control systems",
    "data-driven control",
    "funnel synthesis",
    "robust control",
    "trajectory tracking",
    "LMI",
    "SDP"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "cvxpy>=1.3.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    "python-box>=7.0.0",
    "pandas>=1.4.0",
    "control>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/shiivashaakeri/ddfs"
Documentation = "https://github.com/shiivashaakeri/ddfs#readme"
Repository = "https://github.com/shiivashaakeri/ddfs"
Issues = "https://github.com/shiivashaakeri/ddfs/issues"

[tool.setuptools.packages.find]
where = ["ddfs"]
include = ["ddfs*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["ddfs"]
skip = [".git", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["ddfs/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

