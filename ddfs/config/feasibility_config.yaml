# Feasibility Tube Configuration
# Configuration for computing P_min(k) and R_max(k) ellipsoids

# Ellipsoid utility parameters
ellipsoid_params:
  x_max: 10.0           # Maximum state deviation (numerical stability)
  u_max: 2.0            # Maximum control deviation (numerical stability)
  solver: 'SCS'        # CVXPY solver: 'ECOS', 'SCS', 'MOSEK'
  safety_margin: 0.2    # Additional safety margin for obstacles (m)

# State constraints (box)
state_constraints:
  box:
    x_min: [-10.0, -10.0, -6.283185307179586]  # [x, y, θ] lower bounds
    x_max: [10.0, 10.0, 6.283185307179586]     # [x, y, θ] upper bounds

# Input constraints (box)
input_constraints:
  box:
    u_min: [-2.0, -2.0]   # [v, ω] lower bounds
    u_max: [2.0, 2.0]     # [v, ω] upper bounds

# Obstacles (loaded from environment config by default)
# Can override or add additional obstacles here
obstacles:
  # Example: Add extra temporary obstacles
  # - type: circle
  #   center: [5.0, 5.0]
  #   radius: 0.8
  #   safety_margin: 0.2
  # 
  # - type: ellipse
  #   center: [3.0, -2.0]
  #   semi_axes: [1.5, 0.8]
  #   rotation: 0.785  # 45 degrees in radians
  #   safety_margin: 0.2

# Visualization parameters
visualization:
  n_ellipses: 30        # Number of ellipsoids to draw in tube
  alpha: 0.2            # Transparency of ellipsoids
  figsize: [14, 12]     # Figure size [width, height]
  dpi: 150              # Resolution for saved figures
  show_segments: true   # Show segment boundaries
  segment_colors: true  # Use different colors for segments

# Output settings
output:
  save_plots: true
  save_data: true
  output_dir: 'data/feasibility'
  formats: ['png', 'pdf']  # Plot formats to save