# =============================================================================
# DDFS Default Configuration
# =============================================================================
# This file contains default parameters that apply to all systems.
# System-specific configurations override these defaults.

config_name: "default"
output_dir: "results"

# -----------------------------------------------------------------------------
# Simulation Parameters
# -----------------------------------------------------------------------------
simulation:
  dt: 0.02          # Timestep [s]
  N: 1000           # Horizon length [steps]

# -----------------------------------------------------------------------------
# DDFS Algorithm Parameters
# -----------------------------------------------------------------------------
ddfs:
  T: 100            # Segment length [steps]
  L: 60             # Data window length [steps]
  alpha: 0.98       # Lyapunov decay rate (0 < alpha < 1)
  mu: 1.02          # Cross-segment growth factor (mu >= 1)
  epsilon_bar: 0.15 # Excitation bound for persistence of excitation

# -----------------------------------------------------------------------------
# Solver Settings
# -----------------------------------------------------------------------------
solver:
  name: "ECOS"          # Solver name: MOSEK, SCS, ECOS, CVXOPT
  verbose: false        # Solver verbosity
  max_iters: 10000      # Maximum solver iterations
  eps_abs: 1.0e-8       # Absolute tolerance
  eps_rel: 1.0e-8       # Relative tolerance

  # SCvx-specific parameters
  scvx_max_iters: 50    # Maximum SCvx iterations
  scvx_tol: 1.0e-6      # SCvx convergence tolerance
  trust_region_init: 1.0   # Initial trust region radius
  trust_region_min: 1.0e-4 # Minimum trust region radius
  trust_region_max: 10.0   # Maximum trust region radius

# -----------------------------------------------------------------------------
# Lipschitz Constant Estimation
# -----------------------------------------------------------------------------
lipschitz:
  n_samples: 1000           # Number of samples for estimation
  perturbation_scale: 1.0e-4  # Finite difference step size
  use_analytical: false     # Use analytical bounds if available

# -----------------------------------------------------------------------------
# Visualization Settings
# -----------------------------------------------------------------------------
visualization:
  save_figures: true
  figure_format: "png"
  dpi: 150
  show_plots: true
  plot_funnels: true
  plot_constraints: true
  plot_obstacles: true

# -----------------------------------------------------------------------------
# System Configuration (placeholder - override in system-specific files)
# -----------------------------------------------------------------------------
system:
  name: "default"
  n_states: 1
  n_inputs: 1
  state_labels: ["x"]
  input_labels: ["u"]
  x_init: [0.0]
  x_final: [0.0]
  bounds:
    x_min: [-10.0]
    x_max: [10.0]
    u_min: [-1.0]
    u_max: [1.0]
  params: {}
  obstacles: []
  mismatch: {}