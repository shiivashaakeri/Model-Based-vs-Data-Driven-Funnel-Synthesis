# Successive Convexification (SCvx) Planner Configuration
#
# Parameters for trajectory optimization with obstacle avoidance

# Time discretization
dt: 0.1               # Time step (seconds)
N: 120                 # Horizon length (number of timesteps)
                      # Total time = dt * N = 6.0 seconds

# Initial and goal states
initial_state: [0.5, 0.5, 0.0]    # [px, py, theta] - Start position
goal_state: [7.0, 7.0, 0.0]       # [px, py, theta] - Goal position

# State constraints (box constraints)
state_bounds:
  x_min: [0.0, 0.0, -3.14159]     # [px_min, py_min, theta_min]
  x_max: [8.0, 8.0, 3.14159]      # [px_max, py_max, theta_max]

# Input constraints (box constraints)
input_bounds:
  u_min: [0.0, -1.0]              # [v_min, omega_min]
  u_max: [1.0, 1.0]               # [v_max, omega_max]

# SCvx algorithm parameters
algorithm:
  max_iterations: 50              # Maximum number of SCvx iterations (increased)
  
  # Convergence tolerances
  tol_x: 0.005                    # State convergence tolerance (relaxed from 0.001)
  tol_u: 0.005                    # Input convergence tolerance (relaxed from 0.001)
  
  # Trust region parameters
  trust_region:
    rho_init: 5.0                 # Initial trust region radius (increased from 1.0)
    rho_min: 0.01                 # Minimum trust region radius (increased from 0.0001)
    rho_max: 20.0                 # Maximum trust region radius (increased from 10.0)
    beta_expand: 1.3              # Expansion factor (reduced from 1.5 for stability)
    gamma_contract: 0.8           # Contraction factor (increased from 0.7 for slower reduction)
  
  # Cost function weights
  weights:
    control: 1.0                  # Control effort: ||u||^2
    trust_region: 1.0             # Trust region penalty: ||x - x_ref||^2 (reduced from 10.0)
    terminal: 50.0                # Terminal cost: ||x(N) - x_goal||^2 (reduced from 100.0)
  
  # Verbosity
  verbose: true                   # Print iteration progress

# Solver settings
solver:
  name: "ECOS"                    # Options: "ECOS", "MOSEK", "SCS"
  verbose: false                  # Solver verbosity
  max_iters: 1000                 # Maximum solver iterations (increased)
  abstol: 1e-6                    # Absolute tolerance (relaxed)
  reltol: 1e-5                    # Relative tolerance (relaxed)
  feastol: 1e-6                   # Feasibility tolerance (relaxed)

# Initialization strategy
initialization:
  method: "obstacle_aware"        # Options: "straight_line", "obstacle_aware", "custom"
  detour_margin: 1.5              # Margin to detour around obstacles (in obstacle radii)
  # If method == "custom", provide custom_trajectory_file
  # custom_trajectory_file: "path/to/initial_guess.pkl"

# Obstacle handling
obstacles:
  use_slack: true                 # Use slack variables for soft constraints
  slack_penalty: 1e5              # Penalty weight for slack variables (high to discourage violations)

# Validation thresholds
validation:
  max_linearization_error: 0.01  # Maximum acceptable linearization error
  min_obstacle_clearance: 0.05   # Minimum acceptable clearance to obstacles
  max_goal_error: 0.2            # Maximum acceptable final goal error (relaxed from 0.1)

# Output settings
output:
  save_trajectory: true
  save_history: true
  save_format: "pickle"          # Options: "pickle", "numpy", "json"
  output_dir: "data/nominal_trajectories"
  filename_prefix: "unicycle_nominal"

# Visualization settings (for debugging during planning)
debug_visualization:
  enabled: false                 # Show plots during planning
  plot_every_n_iterations: 5     # Update plot every N iterations
  show_trust_region: true
  show_linearization: true

# Performance settings
performance:
  parallel: false                # Parallel linearization (future feature)
  cache_linearizations: false    # Cache linearizations (future feature)

# Experiment metadata
experiment:
  name: "unicycle_obstacle_avoidance"
  description: |
    SCvx trajectory planning for unicycle with 2 circular obstacles.
    Goal: Navigate from bottom-left to top-right while avoiding obstacles.
  tags: ["unicycle", "scvx", "obstacle_avoidance"]

# Notes
notes: |
  This configuration is for the initial nominal trajectory generation.
  
  Key parameters to tune for performance:
  - dt: Smaller = more accurate but slower
  - N: Longer horizon allows more time to avoid obstacles
  - weights: Balance between control effort and tracking
  - trust_region: Affects convergence speed and robustness
  
  UPDATED PARAMETERS (for better feasibility):
  - Increased trust_region.rho_init to 5.0 (more initial flexibility)
  - Increased trust_region.rho_min to 0.01 (don't give up too early)
  - Reduced terminal weight to 50.0 (softer goal constraint)
  - Reduced trust_region weight to 1.0 (allow more deviation)
  - Relaxed convergence tolerances to 0.005
  - Added obstacle-aware initialization
  - Added slack variables for obstacle constraints
  
  If planning still fails:
  1. Increase N (longer horizon, e.g., 80)
  2. Increase trust_region.rho_init further (e.g., 10.0)
  3. Reduce terminal weight further (e.g., 20.0)
  4. Check obstacles are not completely blocking the path