# Data Collection Configuration for DDFS
# This file specifies parameters for offline trajectory collection

# Sampling configuration
sampling:
  n_samples: 20                    # Number of trajectories to collect
  semi_axes: [0.2, 0.2, 0.1]      # Ellipsoid semi-axes for initial state sampling [px, py, theta]
  seed: 42                         # Random seed for reproducibility

# Excitation configuration
excitation:
  magnitude: 0.1                   # Maximum excitation magnitude for inputs
  type: "uniform"                  # Type of excitation signal (uniform, gaussian)

# Plant mismatch parameters
plant_mismatch:
  velocity_scale: 0.95            # Plant velocity is 5% slower than twin
  angular_rate_scale: 1.03        # Plant turns 3% faster than twin
  slip_coefficient: 0.02          # Lateral slip coefficient

# Segmentation configuration
segmentation:
  segment_length: 20               # Length of each segment (timesteps)
  overlap: 0                       # Overlap between segments (timesteps)
  auto_segment_length: false       # Automatically determine segment length

# Informativity checking
informativity:
  rank_threshold: 1.0e-10         # Singular value threshold for rank computation
  min_condition_number: 1.0e-8    # Minimum acceptable condition number
  warn_on_failure: true           # Warn if informativity check fails

# Output configuration
output:
  output_dir: "data/offline_datasets"
  save_trajectory_plots: true
  save_matrix_stats: true
  save_informativity_report: true

# Validation
validation:
  check_collision: true           # Check trajectories don't collide with obstacles
  max_deviation: 1.0              # Maximum allowed deviation from nominal (meters)
  check_constraints: true         # Verify state/input constraints