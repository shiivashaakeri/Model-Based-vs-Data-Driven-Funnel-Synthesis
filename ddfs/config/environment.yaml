# Environment Configuration
#
# Defines workspace bounds, obstacles, and safety parameters.

# Workspace bounds (2D)
workspace:
  x_min: 0.0
  x_max: 8.0
  y_min: 0.0
  y_max: 8.0

  # Visualization settings
  grid: true
  grid_spacing: 1.0

# Obstacles (2 fixed obstacles as per requirements)
obstacles:
  - id: "obs_1"
    type: "circle"
    center: [3.0, 3.0]
    radius: 0.8
    safety_margin: 0.25            # Increased from 0.2 to enforce better clearance (reduced from 0.3 for feasibility)
    description: "First obstacle in middle-left region"
  - id: "obs_2"
    type: "circle"
    center: [5.5, 4.5]
    radius: 0.6
    safety_margin: 0.25            # Increased from 0.2 to enforce better clearance (reduced from 0.3 for feasibility)
    description: "Second obstacle in middle-right region"
  
# Alternatively obstacle configurations (for testing)
alternative_configs:
  easy:
    # Smaller obstacles, easier to navigate
    obstacles:
      - type: "circle"
        center: [3.0, 3.0]
        radius: 0.5
        safety_margin: 0.1
      - type: "circle"
        center: [5.5, 4.5]
        radius: 0.4
        safety_margin: 0.1
    
  hard:
    # Larger obstacles, harder to navigate
    obstacles:
      - type: "circle"
        center: [3.0, 3.0]
        radius: 1.0
        safety_margin: 0.2
      - type: "circle"
        center: [5.5, 4.5]
        radius: 0.8
        safety_margin: 0.3
    
  narrow_passage:
    # Creates a narrow passage between obstacles
    obstacles:
      - type: "circle"
        center: [4.0, 3.0]
        radius: 1.2
        safety_margin: 0.2
      
      - type: "circle"
        center: [4.0, 5.5]
        radius: 1.2
        safety_margin: 0.2

# Safety parameters
safety:
  minimum_clearance: 0.1   # Minimum acceptable distance to obstacles (m) - balanced for feasibility
  clearance_warning: 0.3   # Warn if clearance falls below this (m)

# Visualization settings
visualization:
  obstacle_color: "red"
  obstacle_alpha: 0.3
  obstacle_edge_color: "darkred"
  obstacle_edge_width: 2

  workspace_boundary_color: "green"
  workspace_boundary_width: 2
  workspace_boundary_style: "--"

  figure_size: [10, 10]
  figure_dpi: 100

# Notes
notes: |
  The environment contains 2 fixed circular obstacles.
  Safety margins expand the obstacle size for conservative collision avoidance.
  
  Effective obstacle radius = radius + safety_margin
  
  Alternative configurations can be selected for different difficulty levels.